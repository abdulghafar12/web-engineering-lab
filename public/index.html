<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Engineering Lab</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Skip to main content -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header>
    <h1 id="greeting">WellCome to My page</h1>
    <nav>
      <ul>
        <li><a href="#">Home</a>
        </li>
        <li><a href="#">About</a>
        </li>
        <li><a href="#">Contact</a>
        </li>

      </ul>
    </nav>
  </header>
  <!-- Main content  -->
  <main id="main-content">
    <!-- Office Hours -->
    <section id="office-hours">
      <h2>Office Hours</h2>
      <br>
      <table>
        <caption>Weekly Office Hours</caption>
        <thead>
          <tr>
            <th scope="col">Day</th>
            <th scope="col">Time</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Monday</td>
            <td> <time datetime="10:00">10:00 AM</time> - <time datetime="12:00">12:00 PM</time> </td>
          </tr>
          <tr>
            <td>Wednesday</td>
            <td> <time datetime="14:00">2:00 PM</time> - <time datetime="16:00">4:00 PM</time> </td>
          </tr>
          <tr>
            <td>Friday</td>
            <td> <time datetime="10:00">10:00 AM</time> - <time datetime="12:00">12:00 PM</time> </td>
          </tr>
        </tbody>
      </table>
    </section>
    <br>
    <!-- Decorative SVG divider -->
    <svg aria-hidden="true" width="100%" height="20" viewBox="0 0 500 20">
      <line x1="0" y1="10" x2="500" y2="10" stroke="currentColor" stroke-width="2" />
    </svg>

    <!-- Informative SVG icon -->
    <figure>

      <svg role="img" width="60" height="60" viewBox="0 0 100 100">
        <title>Office Hours Calendar Icon</title>
        <rect x="15" y="20" width="70" height="65" fill="none" stroke="currentColor" stroke-width="4" />
        <line x1="15" y1="40" x2="85" y2="40" stroke="currentColor" stroke-width="4" />
        <line x1="35" y1="10" x2="35" y2="30" stroke="currentColor" stroke-width="4" />
        <line x1="65" y1="10" x2="65" y2="30" stroke="currentColor" stroke-width="4" />
      </svg>
      <figcaption>Office Hours Calendar</figcaption>

    </figure>

  </main>
  <br>
  <br>
  <footer>
    <address>
      Email:
      <a href="mailto:example@email.com">example@email.com</a>
      <br>
      Phone: <a href="tel:+921234567890">+92 123 4567890</a>
    </address>
    <br>
  </footer>
  <script src="script.js"></script>
</body>

</html>
